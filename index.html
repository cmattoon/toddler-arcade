<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Toddler Arcade</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #141926;
        font-family: 'Fredoka', 'Nunito', 'Rounded Mplus 1c', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        touch-action: none;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      #arcade-canvas {
        display: block;
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="arcade-canvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
